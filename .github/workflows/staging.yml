name: Staging CI/CD

on:
  push:
    branches: [ "staging" ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.2'

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions (safer)
        run: chmod -R u+w,g+w storage bootstrap/cache

      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Execute tests (Unit and Feature tests) via PHPUnit/Pest
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

      - name: PHP Quality Code Check
        run: |
          ./vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: JavaScript Linting
        run: |
          npx eslint resources/js --ext .js,.vue --ignore-pattern "*.min.js" --max-warnings=0

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    if: needs.tests.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies for deployment
        run: npm ci

      - name: Build Assets for deployment
        run: npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (staging live)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Pull project settings and download production env (do not build here)
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

          # Verify APP_KEY exists in the pulled production env to avoid runtime warning
          if [ ! -f .vercel/.env.production.local ]; then
            echo "::error::Missing .vercel/.env.production.local after vercel pull; ensure project env variables are configured in Vercel."
            exit 1
          fi

          if ! grep -q '^APP_KEY=' .vercel/.env.production.local; then
            echo "::error::APP_KEY is not set in Vercel production env. Add APP_KEY to Vercel project settings to avoid runtime errors."
            echo "You can generate one locally with: php artisan key:generate --show"
            exit 1
          fi

          # Let Vercel perform the build on their platform (avoid native PHP builder issues on GH runners)
          npx vercel deploy --prod --token="$VERCEL_TOKEN" --confirm
